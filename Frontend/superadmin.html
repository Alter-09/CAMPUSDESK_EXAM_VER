<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Panel de Superadministrador de CampusDesk." />
    <title>CampusDesk | Panel de Superadministrador</title>
    <link rel="icon" href="./Assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./stylesheet/main.css" />
</head>
<body>
    <div class="superadmin-page" data-shell>
        <aside id="sidebar" class="superadmin-sidebar" data-sidebar aria-label="Navegación principal">
            <a class="superadmin-brand" href="./superadmin.html" aria-label="CampusDesk, Vista SuperAdministrador">
                <img class="superadmin-brand__mark" src="./Assets/favicon.svg" width="40" height="40" alt="" />
                <span class="superadmin-brand__copy">
                    <span class="superadmin-brand__name">CAMPUSDESK</span>
                    <span class="superadmin-brand__view">Vista SuperAdministrador</span>
                </span>
            </a>
            <nav class="superadmin-navigation">
                <section class="superadmin-nav-group" aria-labelledby="general-navigation">
                    <h2 id="general-navigation" class="superadmin-nav-group__label">General</h2>
                    <a class="superadmin-nav-link" href="#overview" aria-current="page">
                        <img class="superadmin-nav-link__icon" src="./Assets/Icons/dashboard.svg" width="24" height="24" alt="" />
                        <span class="superadmin-nav-link__text">Dashboard</span>
                    </a>
                </section>
                <section class="superadmin-nav-group" aria-labelledby="security-navigation">
                    <h2 id="security-navigation" class="superadmin-nav-group__label">Seguridad</h2>
                    <a class="superadmin-nav-link" href="./newuser.html">
                        <img class="superadmin-nav-link__icon" src="./Assets/Icons/user-logo.svg" width="24" height="24" alt="" />
                        <span class="superadmin-nav-link__text">Crear nuevo Usuario</span>
                    </a>
                    <a class="superadmin-nav-link" href="./roleselector.html">
                        <img class="superadmin-nav-link__icon" src="./Assets/Icons/shieldlock.svg" width="24" height="24" alt="" />
                        <span class="superadmin-nav-link__text">Roles y Permisos</span>
                    </a>
                </section>
                <section class="superadmin-nav-group" aria-labelledby="people-navigation">
                    <h2 id="people-navigation" class="superadmin-nav-group__label">Personal</h2>
                    <a class="superadmin-nav-link" href="./techguys.html">
                        <img class="superadmin-nav-link__icon" src="./Assets/Icons/technician.svg" width="24" height="24" alt="" />
                        <span class="superadmin-nav-link__text">Técnicos</span>
                    </a>
                    <a class="superadmin-nav-link" href="./userlist.html">
                        <img class="superadmin-nav-link__icon" src="./Assets/Icons/users.svg" width="24" height="24" alt="" />
                        <span class="superadmin-nav-link__text">Usuarios</span>
                    </a>
                </section>
                <section class="superadmin-nav-group" aria-labelledby="tickets-navigation">
                    <h2 id="tickets-navigation" class="superadmin-nav-group__label">Tiquetes</h2>
                    <a class="superadmin-nav-link" href="./assignation.html">
                        <img class="superadmin-nav-link__icon" src="./Assets/Icons/assign.svg" width="24" height="24" alt="" />
                        <span class="superadmin-nav-link__text">Asignar Técnico</span>
                    </a>
                    <a class="superadmin-nav-link" href="./ticketlist.html">
                        <img class="superadmin-nav-link__icon" src="./Assets/Icons/search.svg" width="24" height="24" alt="" />
                        <span class="superadmin-nav-link__text">Estado de Tiquetes</span>
                    </a>
                </section>
            </nav>
            <div class="superadmin-sidebar__footer">
                <a class="superadmin-nav-link superadmin-nav-link--danger" href="./index.html">
                    <img class="superadmin-nav-link__icon" src="./Assets/Icons/logout.svg" width="24" height="24" alt="" />
                    <span class="superadmin-nav-link__text">Cerrar sesión</span>
                </a>
            </div>
        </aside>
        <div class="superadmin-backdrop" data-sidebar-backdrop></div>
        <div class="superadmin-workspace">
            <header class="app-header">
                <div class="app-header__start">
                    <button class="app-header__menu-button" type="button" data-sidebar-toggle aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú de navegación">
                        <img class="app-header__menu-icon" src="./Assets/Icons/menu.svg" width="24" height="24" alt="menu icon" />
                    </button>
                    <nav class="app-header__breadcrumb" aria-label="Ubicación actual">
                        <ol class="app-header__crumbs">
                            <li class="app-header__crumb">TechNova Solutions</li>
                            <li class="app-header__crumb" aria-current="page">Panel general</li>
                        </ol>
                    </nav>
                </div>
                <div class="app-header__user" style="display: flex; align-items: center; gap: 12px;">
                    <cd-notification-center></cd-notification-center>
                    <span class="app-header__role">Superadmin</span>
                    <img class="app-header__menu-icon" src="./Assets/Icons/user.svg" width="24" height="24" alt="user icon" />
                </div>
            </header>
            <main id="overview" class="superadmin-content superadmin-content--dashboard">
                <cd-announcement-banner></cd-announcement-banner>
                <section class="superadmin-dashboard" aria-label="Panel financiero">
                    <div data-revenue-chart></div>
                </section>
            </main>
        </div>
    </div>
    <template id="revenue-chart-template">
        <section class="revenue-chart" aria-labelledby="revenue-chart-title">
            <header class="revenue-chart__header">
                <div class="revenue-chart__heading">
                    <p class="revenue-chart__eyebrow" id="revenue-chart-title">Volumen total de incidencias</p>
                    <div class="revenue-chart__headline">
                        <span class="revenue-chart__main-val" data-stat-total>—</span>
                        <span class="revenue-chart__trend-badge" data-stat-growth>+18.4% ↗</span>
                    </div>
                </div>
                <div class="revenue-chart__header-right">
                    <div class="revenue-chart__legend">
                        <div class="revenue-chart__legend-item">
                            <span class="revenue-chart__legend-dot revenue-chart__legend-dot--purple" aria-hidden="true"></span>
                            <span class="revenue-chart__legend-label">Resueltos / Cerrados</span>
                        </div>
                        <div class="revenue-chart__legend-item">
                            <span class="revenue-chart__legend-dot revenue-chart__legend-dot--cyan" aria-hidden="true"></span>
                            <span class="revenue-chart__legend-label">Abiertos / En proceso</span>
                        </div>
                    </div>
                    <div class="revenue-chart__period-pill">
                        <img class="app-header__menu-icon" src="./Assets/Icons/calendar.svg" width="24" height="24" alt="" />
                        <span class="revenue-chart__period-text">Ene 2026 - Dic 2026</span>
                    </div>
                </div>
            </header>
            <div class="revenue-chart__quick-stats" aria-label="Resumen rápido de métricas">
                <div class="revenue-chart__stat-card">
                    <span class="revenue-chart__stat-label">Abiertos</span>
                    <strong class="revenue-chart__stat-value" data-summary-open>—</strong>
                </div>
                <div class="revenue-chart__stat-card">
                    <span class="revenue-chart__stat-label">En Proceso / Asignados</span>
                    <strong class="revenue-chart__stat-value" data-summary-progress>—</strong>
                </div>
                <div class="revenue-chart__stat-card">
                    <span class="revenue-chart__stat-label">Resueltos / Cerrados</span>
                    <strong class="revenue-chart__stat-value" data-summary-done>—</strong>
                </div>
                <div class="revenue-chart__stat-card">
                    <span class="revenue-chart__stat-label">Tasa de Resolución</span>
                    <strong class="revenue-chart__stat-value" data-summary-efficiency>—</strong>
                </div>
            </div>
            <div class="revenue-chart__plot" data-chart-plot>
                <svg class="revenue-chart__svg" data-chart-svg viewBox="0 0 1000 440" role="img" aria-label="Gráfico de líneas de rendimiento de tiquetes" tabindex="0"></svg>
                
                <div class="revenue-chart__tooltip" data-chart-tooltip role="status" aria-live="polite" aria-hidden="true">
                    <p class="revenue-chart__tooltip-date" data-tooltip-date>Junio 2026</p>
                    <div class="revenue-chart__tooltip-top">
                        <strong class="revenue-chart__tooltip-total" data-tooltip-total>—</strong>
                        <span class="revenue-chart__tooltip-growth" data-tooltip-badge>+12.5% ↗</span>
                    </div>
                    <div class="revenue-chart__tooltip-divider"></div>
                    <div class="revenue-chart__tooltip-row">
                        <span class="tooltip-dot tooltip-dot--purple"></span>
                        <span class="tooltip-name">Resueltos:</span>
                        <strong data-tooltip-resolved>—</strong>
                    </div>
                    <div class="revenue-chart__tooltip-row">
                        <span class="tooltip-dot tooltip-dot--cyan"></span>
                        <span class="tooltip-name">Abiertos / En proceso:</span>
                        <strong data-tooltip-open>—</strong>
                    </div>
                    <div class="revenue-chart__tooltip-row">
                        <span class="tooltip-name">Eficiencia:</span>
                        <strong data-tooltip-efficiency style="color: #34d399;">—</strong>
                    </div>
                </div>
            </div>
            <div class="revenue-chart__footer">
                <span class="revenue-chart__source" data-chart-status aria-live="polite">Sincronizando con base de datos…</span>
            </div>
        </section>
    </template>
    <script type="module" src="./scripts/components/cd-notification-center.js"></script>
    <script type="module" src="./scripts/components/cd-announcement-banner.js"></script>
    <script type="module" src="./scripts/modules/sidebar-toggle.js"></script>
    <script type="module" src="./scripts/modules/superadmin-dashboard.js"></script>
</body>
</html>
