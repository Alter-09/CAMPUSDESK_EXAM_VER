<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Panel de gestión técnica de CampusDesk." />
    <title>CampusDesk | Técnico</title>
    <link rel="icon" href="./Assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./stylesheet/main.css" />
</head>
<body>
    <div class="superadmin-page" data-shell>
        <aside id="sidebar" class="superadmin-sidebar" data-sidebar aria-label="Navegación principal">
            <a class="superadmin-brand" href="./technician.html" aria-label="CampusDesk, Vista Técnico">
                <img class="superadmin-brand__mark" src="./Assets/favicon.svg" width="40" height="40" alt="campusdesk logo" />
                <span class="superadmin-brand__copy">
                    <span class="superadmin-brand__name">CAMPUSDESK</span>
                    <span class="superadmin-brand__view">Vista Técnico</span>
                </span>
            </a>

            <nav class="superadmin-navigation">
                <section class="superadmin-nav-group" aria-labelledby="general-navigation">
                    <h2 id="general-navigation" class="superadmin-nav-group__label">General</h2>
                    <a class="superadmin-nav-link" href="#overview">
                        <img class="superadmin-nav-link__icon" src="./Assets/Icons/dashboard.svg" width="24" height="24" alt="dashboard icon" />
                        <span class="superadmin-nav-link__text">Dashboard</span>
                    </a>
                </section>

                <section class="superadmin-nav-group" aria-labelledby="tickets-navigation">
                    <h2 id="tickets-navigation" class="superadmin-nav-group__label">Tiquetes</h2>
                    <a class="superadmin-nav-link" href="#assigned-tickets" aria-current="page">
                        <img class="superadmin-nav-link__icon" src="./Assets/Icons/assign.svg" width="24" height="24" alt="assign icon" />
                        <span class="superadmin-nav-link__text">Tiquetes Asignados</span>
                    </a>
                    <a class="superadmin-nav-link" href="#resolved-tickets">
                        <img class="superadmin-nav-link__icon" src="./Assets/Icons/search.svg" width="24" height="24" alt="search icon" />
                        <span class="superadmin-nav-link__text">Historial de Resueltos</span>
                    </a>
                </section>
            </nav>

            <div class="superadmin-sidebar__footer">
                <a class="superadmin-nav-link superadmin-nav-link--danger" href="./index.html">
                    <img class="superadmin-nav-link__icon" src="./Assets/Icons/logout.svg" width="24" height="24" alt="logout icon" />
                    <span class="superadmin-nav-link__text">Cerrar sesión</span>
                </a>
            </div>
        </aside>
        <div class="superadmin-backdrop" data-sidebar-backdrop></div>

        <div class="superadmin-workspace">
            <header class="app-header">
                <div class="app-header__start">
                    <button class="app-header__menu-button" type="button" data-sidebar-toggle aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú de navegación">
                        <img class="app-header__menu-icon" src="./Assets/Icons/menu.svg" width="24" height="24" alt="menu icon" />
                    </button>
                    <nav class="app-header__breadcrumb" aria-label="Ubicación actual">
                        <ol class="app-header__crumbs">
                            <li class="app-header__crumb">TechNova Solutions</li>
                            <li class="app-header__crumb" aria-current="page">Tiquetes Asignados</li>
                        </ol>
                    </nav>
                </div>
                <div class="app-header__user" style="display: flex; align-items: center; gap: 12px;">
                    <cd-notification-center></cd-notification-center>
                    <span class="app-header__role">Técnico</span>
                    <img class="app-header__menu-icon" src="./Assets/Icons/user.svg" width="24" height="24" alt="user icon" />
                </div>
            </header>

            <main id="technician-main" class="superadmin-content">
                <cd-announcement-banner></cd-announcement-banner>
                <section id="section-assigned-tickets" class="technician-view">
                    <cd-assigned-tickets></cd-assigned-tickets>
                </section>
                <section id="section-overview" class="technician-view">
                    <cd-technician-dashboard></cd-technician-dashboard>
                </section>
                <section id="section-general-queue" class="technician-view" hidden>
                    <section class="superadmin-empty-state" aria-labelledby="queue-title">
                        <p class="superadmin-empty-state__eyebrow">Cola de Soporte</p>
                        <h1 id="queue-title" class="superadmin-empty-state__title">Cola General de Tiquetes</h1>
                        <p class="superadmin-empty-state__description">Los administradores gestionan y asignan las solicitudes desde la mesa central.</p>
                    </section>
                </section>
            </main>
        </div>
    </div>
    <script type="module" src="./scripts/components/cd-notification-center.js"></script>
    <script type="module" src="./scripts/components/cd-announcement-banner.js"></script>
    <script type="module" src="./scripts/components/technician-dashboard.js"></script>
    <script type="module" src="./scripts/components/assigned-tickets.js"></script>
    <script type="module" src="./scripts/modules/technician-nav.js"></script>
    <script type="module" src="./scripts/modules/sidebar-toggle.js"></script>
</body>
</html>
