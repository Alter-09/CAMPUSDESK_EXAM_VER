<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portal de usuario de CampusDesk — resumen de actividad y acceso rápido a solicitudes de soporte." />
    <title>CampusDesk | Portal de Usuario</title>
    <link rel="icon" href="./Assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./stylesheet/main.css" />
</head>
<body>
    <div class="superadmin-page" data-shell>

        <!-- ── Sidebar de navegación ───────────────────────────────────── -->
        <aside id="sidebar" class="superadmin-sidebar" data-sidebar aria-label="Navegación principal">

            <a class="superadmin-brand" href="./user.html" aria-label="CampusDesk, Portal de Usuario">
                <img class="superadmin-brand__mark" src="./Assets/favicon.svg" width="40" height="40" alt="" />
                <span class="superadmin-brand__copy">
                    <span class="superadmin-brand__name">CAMPUSDESK</span>
                    <span class="superadmin-brand__view">Portal de Usuario</span>
                </span>
            </a>

            <nav class="superadmin-navigation">
                <section class="superadmin-nav-group" aria-labelledby="general-nav-label">
                    <h2 id="general-nav-label" class="superadmin-nav-group__label">General</h2>
                    <a class="superadmin-nav-link" href="./user.html" aria-current="page" id="nav-overview">
                        <img class="superadmin-nav-link__icon" src="./Assets/Icons/dashboard.svg" width="24" height="24" alt="" />
                        <span class="superadmin-nav-link__text">Inicio</span>
                    </a>
                </section>

                <section class="superadmin-nav-group" aria-labelledby="tickets-nav-label">
                    <h2 id="tickets-nav-label" class="superadmin-nav-group__label">Tiquetes</h2>
                    <a class="superadmin-nav-link" href="./create-ticket.html" id="nav-create">
                        <img class="superadmin-nav-link__icon" src="./Assets/Icons/assign.svg" width="24" height="24" alt="" />
                        <span class="superadmin-nav-link__text">Crear nuevo Tiquete</span>
                    </a>
                    <a class="superadmin-nav-link" href="./my-tickets.html" id="nav-my-tickets">
                        <img class="superadmin-nav-link__icon" src="./Assets/Icons/search.svg" width="24" height="24" alt="" />
                        <span class="superadmin-nav-link__text">Mis Solicitudes</span>
                    </a>
                </section>
            </nav>

            <div class="superadmin-sidebar__footer">
                <a class="superadmin-nav-link superadmin-nav-link--danger" href="./index.html" id="nav-logout">
                    <img class="superadmin-nav-link__icon" src="./Assets/Icons/logout.svg" width="24" height="24" alt="" />
                    <span class="superadmin-nav-link__text">Cerrar sesión</span>
                </a>
            </div>
        </aside>

        <!-- Fondo oscuro del menú lateral en pantallas pequeñas -->
        <div class="superadmin-backdrop" data-sidebar-backdrop></div>

        <!-- ── Área de trabajo ─────────────────────────────────────────── -->
        <div class="superadmin-workspace">

            <!-- Cabecera con breadcrumb y avatar del usuario -->
            <header class="app-header">
                <div class="app-header__start">
                    <button
                        class="app-header__menu-button"
                        type="button"
                        data-sidebar-toggle
                        aria-controls="sidebar"
                        aria-expanded="false"
                        aria-label="Abrir menú de navegación"
                    >
                        <img class="app-header__menu-icon" src="./Assets/Icons/menu.svg" width="24" height="24" alt="" />
                    </button>
                    <nav class="app-header__breadcrumb" aria-label="Ubicación actual">
                        <ol class="app-header__crumbs">
                            <li class="app-header__crumb">Portal de Usuario</li>
                            <li class="app-header__crumb" aria-current="page">Inicio</li>
                        </ol>
                    </nav>
                </div>
                <div class="app-header__user">
                    <span class="app-header__role" id="header-role">Usuario</span>
                    <img class="app-header__menu-icon" src="./Assets/Icons/user.svg" width="24" height="24" alt="" />
                </div>
            </header>

            <!-- ── Contenido principal ─────────────────────────────────── -->
            <main id="user-main" class="superadmin-content">

                <!-- Sección: Dashboard Especializado del Usuario -->
                <cd-user-dashboard></cd-user-dashboard>

            </main>
        </div>
    </div>

    <!-- Módulo del sidebar responsivo -->
    <script type="module" src="./scripts/modules/sidebar-toggle.js"></script>
    <!-- Componente Dashboard del Usuario -->
    <script type="module" src="./scripts/components/user-dashboard.js"></script>
    <!-- Bootstrap de la página: sincroniza cabecera con datos de sesión -->
    <script type="module" src="./scripts/pages/user-overview.js"></script>
</body>
</html>
