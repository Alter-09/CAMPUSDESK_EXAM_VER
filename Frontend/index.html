<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Inicia sesión en CampusDesk para gestionar y reportar tickets de soporte tecnico de manera eficiente y sencilla."
    />
    <title>CampusDesk | Iniciar sesión</title>
    <link rel="icon" href="./Assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./Stylesheets/main.css" />
  </head>
  <body>
    <main class="login-page" aria-label="Inicio de sesión">
      <div class="login-page__atmosphere" aria-hidden="true"></div>

      <div class="login-page__inner">
        <section class="login-panel" aria-labelledby="login-title">
          <h1 id="login-title" class="login-welcome">Bienvenido a CampusDesk</h1>

          <div class="login-card">
            <p class="login-card__subtitle">Iniciar sesión</p>

            <form id="login-form" class="login-form" action="#" method="post" novalidate>
              <div
                id="login-form-summary"
                class="login-form__summary"
                role="alert"
                aria-live="polite"
              ></div>

              <div class="login-form__fields">
                <div class="field">
                  <label class="field__label" for="email">Correo electrónico</label>
                  <div class="field__control">
                    <input
                      id="email"
                      class="field__input"
                      name="email"
                      type="email"
                      inputmode="email"
                      autocomplete="off"
                      placeholder="Ejemplo: usuario@campusdesk.edu"
                      required
                    />
                  </div>
                  <p id="email-error" class="field__error" aria-live="polite"></p>
                </div>

                <div class="field">
                  <label class="field__label" for="password">Contraseña</label>
                  <div class="field__control">
                    <input
                      id="password"
                      class="field__input field__input--with-action"
                      name="password"
                      type="password"
                      autocomplete="current-password"
                      placeholder="Ingresa tu contraseña"
                      required
                    />
                    <button
                      id="toggle-password"
                      class="field__action"
                      type="button"
                      aria-controls="password"
                      aria-pressed="false"
                      aria-label="Mostrar contraseña"
                    >
                      <img
                        class="field__action-icon"
                        src="./Assets/Icons/icon-visibility.svg"
                        width="24"
                        height="22"
                        alt="CampusDesk - icon"
                        aria-hidden="true"
                      />
                    </button>
                  </div>
                  <p id="password-error" class="field__error" aria-live="polite"></p>
                </div>
              </div>

              <div class="login-form__actions">
                <button class="button button--primary" type="submit">
                  <span class="button__label">Ingresar</span>
                </button>
                <p class="login-form__hint">
                  Acceso privado · Solicita tu cuenta al Administrador
                </p>
              </div>
            </form>
          </div>
        </section>

        <aside class="login-page__brand" aria-label="Marca CampusDesk">
          <img
            class="login-page__brand-image login-page__brand-desktop"
            src="./Assets/Static/Logo2.svg"
            width="768"
            height="768"
            alt="CampusDesk - Logo"
          />
          <img
            class="login-page__brand-mobile"
            src="./Assets/Static/Logo1.svg"
            width="312"
            height="309"
            alt="CampusDesk Logo"
          />
        </aside>
      </div>
    </main>

    <script type="module" src="./Scripts/main.js"></script>
  </body>
</html>
