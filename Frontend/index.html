<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Inicia sesión en CampusDesk para gestionar tu campus desde un solo lugar."
    />
    <title>CampusDesk | Iniciar sesión</title>
    <link rel="icon" href="./Assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./Stylesheets/main.css" />
  </head>
  <body>
    <main class="login-page" aria-label="Inicio de sesión">
      <div class="login-page__inner">
        <section class="login-panel" aria-labelledby="login-title">
          <p class="login-card__welcome-mobile" aria-hidden="true">
            Bienvenido a CampusDesk!
          </p>

          <article class="card login-card login-card--mobile-border">
            <header class="card__header login-card__header">
              <h1 id="login-title" class="card__title">Bienvenido a CampusDesk!</h1>
              <p class="card__subtitle">Iniciar Sesión</p>
            </header>

            <form id="login-form" class="login-form" action="#" method="post" novalidate>
              <div class="login-form__fields">
                <div class="field">
                  <label class="field__label" for="username">Nombre de Usuario</label>
                  <div class="field__control">
                    <input
                      id="username"
                      class="field__input"
                      name="username"
                      type="text"
                      autocomplete="username"
                      placeholder="Ejemplo: Usuario2026"
                      required
                    />
                  </div>
                </div>

                <div class="field">
                  <label class="field__label field__label--password" for="password">
                    Contraseña
                  </label>
                  <div class="field__control">
                    <input
                      id="password"
                      class="field__input field__input--with-action"
                      name="password"
                      type="password"
                      autocomplete="current-password"
                      placeholder="Ejemplo: ContraseñaSegura123"
                      required
                    />
                    <button
                      id="toggle-password"
                      class="field__action"
                      type="button"
                      aria-controls="password"
                      aria-pressed="false"
                      data-label-show="Mostrar contraseña"
                      data-label-hide="Ocultar contraseña"
                    >
                      <img
                        class="field__action-icon"
                        src="./Assets/Icons/icon-visibility.svg"
                        width="24"
                        height="22"
                        alt=""
                        aria-hidden="true"
                      />
                    </button>
                  </div>
                </div>
              </div>

              <div class="login-form__actions">
                <button class="button button--primary" type="submit">
                  <span class="button__label-desktop">Iniciar Sesion</span>
                  <span class="button__label-mobile">Login</span>
                </button>
              </div>
            </form>
          </article>
        </section>

        <aside class="login-page__brand" aria-label="Marca CampusDesk">
          <img
            class="login-page__brand-image login-page__brand-desktop"
            src="./Assets/Static/logo-brand.png"
            width="768"
            height="768"
            alt="CampusDesk"
          />
          <img
            class="login-page__brand-mobile"
            src="./Assets/Static/Logo1.svg"
            width="312"
            height="309"
            alt="CampusDesk"
          />
        </aside>
      </div>
    </main>

    <script type="module" src="./Scripts/main.js"></script>
  </body>
</html>
